<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D2A21">
<meta name="description" content="东平湖渔旅体验课堂 · 在线预订：织网体验、渔猎研学、渔家宴、渔家住宿、渔村演艺、非遗手作，选场次、锁名额、生成核销码，到店支付。">
<title>东平湖 · 渔旅体验课堂</title>
<style>
:root{
  --paper:#EDF1E6; --paper2:#E2E8D8; --card:#FFFFFF; --topbg:rgba(237,241,230,.94);
  --ink:#0A2A1F; --ink2:#35564A; --ink3:#799086; --edge:#08231A;
  --line:#D8E0CF; --line2:#C2CDB6;
  --pine:#0E3D2E; --pine2:#17604A; --pine-l:#E1EFE8; --pine-d:#082C21;
  --moss:#41835F; --moss-l:#E9F2EC;
  --gold:#B5843A; --gold-l:#F6EDDA;
  --clay:#A9552C; --clay-l:#F8E9E1;
  --r:16px; --r-s:12px; --tab-h:62px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--ink);line-height:1.68;font-size:15px;
  background:
    radial-gradient(1100px 520px at 10% -6%, #DCE9DA 0%, rgba(220,233,218,0) 60%),
    radial-gradient(900px 480px at 96% 2%, #F0EBD6 0%, rgba(240,235,214,0) 55%),
    repeating-linear-gradient(45deg, rgba(14,61,46,.016) 0 2px, rgba(0,0,0,0) 2px 5px),
    var(--paper);
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tab-h) + 14px);
}
body.hasbar{padding-bottom:calc(var(--tab-h) + 96px)}
@media (min-width:900px){ body.hasbar{padding-bottom:104px} }
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:var(--pine2)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* ---------- 顶部 ---------- */
.top{position:sticky;top:0;z-index:60;background:var(--topbg);backdrop-filter:saturate(1.5) blur(10px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:11px;padding:9px 0;min-height:56px}
.logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:linear-gradient(160deg,var(--pine2),var(--pine));color:#F3F7F2;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 0 var(--edge)}
.tt h1{margin:0;font-size:16px;font-weight:800;line-height:1.2;white-space:nowrap}
.tt .sub{font-size:9.5px;letter-spacing:1.3px;color:var(--ink3);text-transform:uppercase}
.spacer{flex:1}
.bk,.tbtn{height:36px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 11px;font-size:13.5px;font-weight:700;box-shadow:0 2px 0 var(--edge);position:relative}
.tbtxt{font-size:13px;font-weight:800;white-space:nowrap}
.tbtn .badge{position:absolute;top:-5px;right:-5px;transform:none}
.tbtn.on{background:var(--pine);color:#F6FAF5;border-color:var(--pine)}
@media (max-width:560px){
  .tt .sub{display:none}
  .tt h1{font-size:14.5px}
  .tbtn{padding:0 9px;font-size:13px}
  .tbtxt{font-size:12px}
  .toprow{gap:8px}
}
.bk{width:36px;padding:0;font-size:16px}
.topnav{display:none;gap:5px}
.topnav button{padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:700;border:1px solid transparent}
.topnav button.on{background:var(--pine);color:#F3F7F2}

/* ---------- 底部 tab ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;height:var(--tab-h);background:var(--topbg);backdrop-filter:saturate(1.5) blur(10px);border-top:1px solid var(--line);display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--ink3)}
.tabbar button i{font-style:normal;font-size:19px;line-height:1}
.tabbar button.on{color:var(--pine)}
.badge{position:absolute;transform:translate(13px,-11px);background:var(--clay);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}

/* ---------- 通用 ---------- */
.sec{margin-top:26px}
.st{display:flex;align-items:flex-end;gap:9px;margin-bottom:12px}
.st i{font-style:normal;font-size:18px;line-height:1.2}
.st h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px;position:relative;padding-left:12px}
.st h3::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:3px;background:linear-gradient(180deg,var(--pine2),var(--moss))}
.st small{color:var(--ink3);font-size:12px;font-weight:600;margin-left:auto;padding-bottom:2px}
.sub-note{font-size:12.5px;color:var(--ink3);line-height:1.65;margin:-4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 2px 0 var(--edge)}
.card h4{margin:0 0 6px;font-size:15.5px;font-weight:800}
.card p{margin:0;color:var(--ink2);font-size:14px}
.card p+p{margin-top:8px}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid4{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.hint{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:10px}
.note{background:var(--gold-l);border:1px dashed #DCC79A;border-radius:var(--r-s);padding:12px 14px;font-size:12.5px;color:#6B5426;margin-top:12px;line-height:1.7}
.note b{color:#4E3D18}
.soft{background:var(--pine-l);border:1px solid #C6DCCF;border-radius:var(--r-s);padding:12px 14px;font-size:13px;color:#1F4A3B;margin-top:12px}

/* ---------- 轮播 ---------- */
.hero{position:relative;border-radius:18px;overflow:hidden;margin-top:14px;aspect-ratio:16/10;min-height:230px;border:1px solid var(--line);box-shadow:0 3px 0 var(--edge);background:var(--pine)}
.hero .slides{position:absolute;inset:0}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:flex;align-items:flex-end}
.hero .slide.on{opacity:1}
.hero .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.94)}
.hero .slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,26,20,.18),rgba(6,26,20,.84))}
.hero .hb{position:relative;z-index:2;padding:20px;color:#F4F8F3;width:100%}
.hero h2{margin:0;font-size:clamp(21px,4.6vw,31px);font-weight:800;letter-spacing:-.4px;line-height:1.25;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero p{margin:8px 0 0;font-size:13px;color:rgba(244,248,243,.88)}
.kick{display:inline-flex;gap:7px;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:1.2px;background:rgba(244,248,243,.14);border:1px solid rgba(244,248,243,.3);padding:5px 11px;border-radius:999px;margin-bottom:11px}
.dots{position:absolute;right:14px;bottom:14px;z-index:3;display:flex;gap:6px}
.dots button{width:8px;height:8px;border-radius:50%;background:rgba(244,248,243,.42);padding:0}
.dots button.on{background:#F4F8F3;width:20px;border-radius:999px}
.carArrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(6,26,20,.42);color:#F4F8F3;display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid rgba(244,248,243,.25)}
.carArrow.l{left:10px} .carArrow.r{right:10px}
@media (max-width:640px){.carArrow{display:none}}

/* ---------- 数据条 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;background:linear-gradient(150deg,#17604A,#0A3325);border-radius:var(--r);border:1px solid var(--pine-d);box-shadow:0 3px 0 var(--edge);overflow:hidden}
.stat{padding:15px 8px;text-align:center;border-right:1px solid rgba(255,255,255,.13)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:clamp(17px,4.4vw,23px);font-weight:800;color:#F2F7F1;letter-spacing:-.5px}
.stat span{font-size:11px;color:rgba(242,247,241,.72);font-weight:700;line-height:1.35;display:block;margin-top:3px}

/* ---------- 横滑 ---------- */
.scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex:0 0 auto;scroll-snap-align:start}
.hsplit{width:236px;max-width:74vw}

/* ---------- 分类图卡 ---------- */
.qgrid2{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
@media (min-width:760px){ .qgrid2{grid-template-columns:repeat(6,1fr)} }
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 0 var(--edge);text-align:left;width:100%}
.qcard .ph{position:relative;aspect-ratio:16/12;overflow:hidden;background:var(--paper2)}
.qcard .ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.94)}
.qcard .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,35,26,.04),rgba(8,35,26,.76))}
.qcard .ph b{position:absolute;left:9px;right:6px;bottom:7px;z-index:2;color:#F4F8F3;font-size:13px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.qcard .cb{padding:8px 10px 10px}
.qcard .cb span{font-size:11px;color:var(--ink3);font-weight:700;line-height:1.4;display:block}

/* ---------- 深绿面板 ---------- */
.band{background:linear-gradient(155deg,#164A38,#0A2F24);border-radius:var(--r);padding:17px;border:1px solid var(--pine-d);box-shadow:0 3px 0 var(--edge)}
.band .grid3{gap:10px}
.band .bcell{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:13px}
.band h4{color:#EAF3EC;font-size:15px;font-weight:800;margin:0 0 6px}
.band p{color:rgba(234,243,236,.82);font-size:13.5px;margin:0}
.band .figcap{color:rgba(234,243,236,.6)}

/* ---------- 快捷入口 ---------- */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 8px;text-align:center;box-shadow:0 2px 0 var(--edge)}
.q i{font-style:normal;font-size:22px;display:block;line-height:1.3}
.q b{display:block;font-size:13px;font-weight:800;margin-top:2px}
.q span{font-size:10.5px;color:var(--ink3);font-weight:700}

/* ---------- 课程卡 ---------- */
.course{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 0 var(--edge);display:flex;flex-direction:column;text-align:left;width:100%;position:relative}
.course .ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--paper2)}
.course .ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.94)}
.course .tag{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:800;background:rgba(6,26,20,.62);color:#F4F8F3;border:1px solid rgba(244,248,243,.28);padding:3px 9px;border-radius:999px}
.course .seas{position:absolute;right:10px;top:10px;font-size:10.5px;font-weight:800;background:var(--gold);color:#fff;padding:3px 9px;border-radius:999px}
.course .cb{padding:12px 13px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.course .cb b{font-size:15.5px;font-weight:800;line-height:1.35}
.course .bl{font-size:12.5px;color:var(--ink2);line-height:1.6;margin:0}
.course .meta{display:flex;flex-wrap:wrap;gap:6px}
.course .meta span{font-size:11px;color:var(--ink2);background:var(--paper2);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.course .price{display:flex;align-items:baseline;gap:5px;margin-top:auto;padding-top:6px}
.course .price b{font-size:22px;font-weight:800;letter-spacing:-.6px;color:var(--pine)}
.course .price span{font-size:12px;color:var(--ink3)}
.course .left{font-size:11px;font-weight:800;color:var(--moss);margin-left:auto}
.course .acts{display:flex;gap:8px;padding:0 13px 13px}
.course .acts .btn{flex:1;justify-content:center;padding:10px 8px;font-size:13.5px}

/* ---------- 按钮 ---------- */
.btn{padding:12px 22px;border-radius:999px;background:var(--pine);color:#F3F7F2;font-weight:800;font-size:15px;box-shadow:0 2px 0 var(--edge);display:inline-flex;align-items:center;gap:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.gold{background:var(--gold)}
.btn.clay{background:var(--clay)}
.btn.sm{padding:8px 15px;font-size:13px}
.btn.wide{width:100%;justify-content:center}
.btn.xs{padding:6px 12px;font-size:12px}

/* ---------- 筛选 ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;padding:7px 15px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:13.5px;font-weight:700}
.filters button.on{background:var(--pine);color:#F3F7F2;border-color:var(--pine)}

/* ---------- 详情 ---------- */
.gal{display:grid;grid-template-columns:1.9fr 1fr;gap:8px;align-items:stretch}
.gal .gm{position:relative;aspect-ratio:16/10;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gal .gs{position:relative;aspect-ratio:16/10;background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;cursor:pointer}
.gal .gs img{transition:transform .35s}
.gal .gs:hover img{transform:scale(1.05)}
.gal img{width:100%;height:100%;object-fit:cover;filter:saturate(.94)}
.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;display:inline-block}
.p-cat{background:var(--pine-l);color:var(--pine);border:1px solid #C6DCCF}
.p-season{background:var(--gold-l);color:#8A6420;border:1px solid #E0C792}
.pricebox{display:flex;align-items:baseline;gap:8px;margin:12px 0 4px}
.pricebox b{font-size:32px;font-weight:800;letter-spacing:-1.2px;color:var(--pine)}
.pricebox span{color:var(--ink3);font-size:13px}
.kv{display:grid;grid-template-columns:74px 1fr;gap:9px 12px;font-size:13.5px;margin-top:6px}
.kv dt{color:var(--ink3);font-weight:700}
.kv dd{margin:0;color:var(--ink2)}
.ul{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
.ul li{margin:6px 0}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 40px;border-left:2px solid var(--line);margin-left:13px}
.steps li:last-child{border-left-color:transparent;padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:-14px;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--pine);color:#F3F7F2;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps b{display:block;font-size:14px;font-weight:800}
.steps p{margin:2px 0 0;font-size:13px;color:var(--ink2)}

.rows{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:0 2px 0 var(--edge)}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rh{display:flex;align-items:center;gap:10px;padding:13px 15px;width:100%;text-align:left;font-weight:700;font-size:14px}
.rh .cv{margin-left:auto;transition:transform .25s;color:var(--ink3);flex:0 0 auto}
.row.open .rh .cv{transform:rotate(180deg)}
.row.open .rh{color:var(--pine)}
.rb{display:none;padding:0 15px 15px;color:var(--ink2);font-size:13.5px}
.row.open .rb{display:block}

/* ---------- 图片块 ---------- */
.pic{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 0 var(--edge);background:var(--paper2)}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:saturate(.94)}
.pic.wide img{aspect-ratio:16/9}
.pic.tall img{aspect-ratio:4/5}
.pic .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 11px;color:#F4F8F3;background:linear-gradient(180deg,rgba(6,26,20,0),rgba(6,26,20,.84))}
.pic .cap b{display:block;font-size:13.5px;font-weight:800}
.pic .cap span{display:block;font-size:11.5px;color:rgba(244,248,243,.85);line-height:1.5}
.figcap{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:8px}
.tagimg{font-size:10.5px;font-weight:800;color:var(--gold);border:1px solid #E0C792;background:var(--gold-l);border-radius:999px;padding:1px 7px;white-space:nowrap}

/* ---------- 日期 / 场次 ---------- */
.dates{display:flex;gap:8px;overflow-x:auto;padding:3px 0 6px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 auto;width:68px;padding:9px 0;border-radius:12px;border:1px solid var(--line2);background:var(--card);text-align:center;line-height:1.3;box-shadow:0 2px 0 var(--edge)}
.dates button b{display:block;font-size:15px;font-weight:800}
.dates button span{font-size:11px;color:var(--ink3)}
.dates button.on{background:var(--pine);color:#F3F7F2;border-color:var(--pine)}
.dates button.on span{color:rgba(244,248,243,.78)}
.slots{display:grid;gap:9px;margin-top:12px}
.slot{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);background:var(--card);border-radius:var(--r-s);padding:12px 14px;text-align:left;width:100%}
.slot b{font-size:15px;font-weight:800}
.slot small{display:block;font-size:11.5px;color:var(--ink3);font-weight:600}
.slot .sp{flex:1}
.slot.on{border-color:var(--pine);background:#FBFDF9;box-shadow:0 2px 0 var(--edge)}
.slot[disabled]{opacity:.45;cursor:not-allowed}
.stp{display:flex;align-items:center;gap:14px;margin-top:8px}
.stp button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:var(--card);font-size:19px;font-weight:800;box-shadow:0 2px 0 var(--edge)}
.stp b{font-size:20px;font-weight:800;min-width:32px;text-align:center}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13.5px;font-weight:700;margin-bottom:7px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:var(--r-s);padding:12px 13px;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--pine)}
.fld .err{color:var(--clay);font-size:12px;font-weight:700;margin-top:6px;display:none}
.fld.bad input{border-color:var(--clay)}
.fld.bad .err{display:block}
.otprow{display:flex;gap:9px}
.otprow input{flex:1}
.otprow button{flex:0 0 auto;padding:0 15px;border-radius:var(--r-s);border:1px solid var(--pine);background:var(--pine);color:#F3F7F2;font-weight:800;font-size:13.5px;box-shadow:0 2px 0 var(--edge)}
.otprow button[disabled]{opacity:.5}

.bar{position:fixed;left:0;right:0;bottom:var(--tab-h);z-index:65;background:var(--topbg);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 11px}
.bar .wrap{display:flex;align-items:center;gap:10px}
.bar .amt{line-height:1.25;min-width:0}
.bar .amt b{font-size:21px;font-weight:800;letter-spacing:-.6px;color:var(--pine)}
.bar .amt span{display:block;font-size:11.5px;color:var(--ink3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}

/* ---------- 订单 ---------- */
.order{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:0 2px 0 var(--edge);text-align:left;width:100%;margin-bottom:10px}
.order .oh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.order .oh b{font-size:15px;font-weight:800;flex:1}
.order .ol{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:3px}
.order .ol b{font-weight:800;color:var(--ink)}

.p-pending{background:var(--gold-l);color:#8A6420;border:1px solid #E0C792}

.p-canceled{background:#EFEDE5;color:#88867C;border:1px solid #D3D1C7}

.tick{width:64px;height:64px;border-radius:50%;background:var(--pine-l);border:2px solid var(--pine);color:var(--pine);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px}

.chip2.hot{background:var(--pine-l);border-color:#C6DCCF;color:var(--pine)}

@media (min-width:900px){
  body{padding-bottom:20px}
  .tabbar{display:none}
  .topnav{display:flex}
  .bar{bottom:0}
  .wrap{padding:0 22px}

@media (max-width:520px){
  .hero{aspect-ratio:4/3}

}

  var h1=5381, h2=52711, i=0;
  for(i=0;i<s.length;i++){ h1=((h1<<5)+h1+s.charCodeAt(i))>>>0; h2=((h2<<5)+h2^s.charCodeAt(i))>>>0; }

function localSeats(){

  box = {};
  var d, i, k;
  for(d=1; d<=14; d++){
    var iso = addDays(today(), d);
    var dow = new Date(iso+'T00:00:00').getDay();
    for(k in LOCAL_SLOTS){

        (box[k] = box[k] || []).push({ course_code:k, session_date:iso, slot:list[i][0],

    }
  }
  LS.set('dpl_seats', box);
  return box;
}

function leftOf(code,date,slot){
  var arr = S.seatsByCourse[code]||[];
  for(var i=0;i<arr.length;i++){ var s=arr[i];
    if(s.session_date===date && s.slot===slot) return Math.max(0,(s.capacity||0)-(s.booked||0)); }
  return null;
}

  var arr=S.seatsByCourse[code]; if(!arr) return null;

function barcode(text){
  var s='', seed=0;
  for(var i=0;i<text.length;i++) seed=(seed*31+text.charCodeAt(i))%100000;
  for(var j=0;j<58;j++){
    seed=(seed*1103515245+12345)%2147483647;
    var h=16+(Math.abs(seed>>8)%36);
    s+='<i style="height:'+h+'px;width:'+(((j%7===0)||(Math.abs(seed)%3===0))?3:1)+'px"></i>';
  }
  return '<div class="bars">'+s+'</div>';
}

/* ============ 轮播 ============ */
var carTimer=null;
function carPaint(idx){
  var slides=document.querySelectorAll('#hero .slide');
  if(!slides.length) return;
  for(var i=0;i<slides.length;i++) slides[i].classList.toggle('on', i===idx);
  var dots=document.querySelectorAll('#dots button');
  for(var j=0;j<dots.length;j++) dots[j].classList.toggle('on', j===idx);
  S.car=idx;
}
function startCar(){
  clearInterval(carTimer);
  if(S.route.name!=='home') return;
  carTimer=setInterval(function(){
    if(S.route.name!=='home'){ clearInterval(carTimer); return; }
    carPaint((S.car+1) % Math.max(1,S.carOrder.length));
  }, 4600);
}
(function bindCarSwipe(){
  var x0=null;
  document.addEventListener('touchstart', function(e){
    var h=e.target.closest && e.target.closest('#hero');
    if(h){ x0=e.touches[0].clientX; }
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(x0===null) return;
    var dx=(e.changedTouches[0].clientX-x0); x0=null;
    if(Math.abs(dx)<40) return;
    carPaint((S.car + (dx<0?1:-1) + S.carOrder.length) % S.carOrder.length);
  }, {passive:true});
})();

document.addEventListener('click', function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var act=t.getAttribute('data-act');
  if(act==='back'){
    if(history.length>1 && location.hash && location.hash!=='#/home'){ history.back(); }
    else { go(S.session?'me':'home'); }
    return;
  }
  if(act==='filter'){
    S.filter=t.getAttribute('data-k');
    if(location.hash==='#/courses'||location.hash==='#courses'){ S.route={name:'courses',p:''}; paint(); }
    else { go('courses'); }
    return;
  }
  if(act==='car'){ carPaint((S.car + Number(t.getAttribute('data-d')) + S.carOrder.length) % S.carOrder.length); return; }
  if(act==='carjump'){ carPaint(Number(t.getAttribute('data-i'))); return; }
  if(act==='date'){ S.booking.date=t.getAttribute('data-v'); S.booking.slot=''; paint(); return; }
  if(act==='slot'){ S.booking.slot=t.getAttribute('data-v'); paint(); return; }
  if(act==='minus'){ S.booking.qty=Math.max(1,S.booking.qty-1); paint(); return; }
  if(act==='plus'){
    var left=(S.booking.date&&S.booking.slot)?leftOf(S.booking.code,S.booking.date,S.booking.slot):null;
    var cap=20; if(left!==null) cap=Math.min(20,Math.max(1,left));
    if(S.booking.qty>=cap){ toast('该场次最多可订 '+cap, true); return; }
    S.booking.qty++; paint(); return;
  }
  if(act==='submit'){ submitBooking(); return; }
  if(act==='lmode'){ S.loginMode=t.getAttribute('data-v'); paint(); return; }
  if(act==='login'){ doLogin(); return; }
  if(act==='logout'){ doLogout(); return; }
  if(act==='cancel'){ doCancel(t.getAttribute('data-id')); return; }
  if(act==='checkin'){ doCheckin(); return; }
  if(act==='share'){ doShare(); return; }
  if(act==='music'){ bgmToggle(); return; }
  if(act==='intro'){ doIntro(t.getAttribute('data-code')); return; }
  if(act==='row'){ var k=t.getAttribute('data-k'); S.openRows[k]=!S.openRows[k]; t.parentNode.classList.toggle('open', !!S.openRows[k]); return; }
  if(act==='gal'){
    var src=t.getAttribute('data-src');
    var m=document.getElementById('galMain'), ti=document.getElementById('galThumbImg');
    if(m && ti && src){ var cur=m.getAttribute('src'); m.src=src; ti.src=cur; t.setAttribute('data-src',cur); }
    return;
  }
  if(act==='fav'){
    var code=t.getAttribute('data-code');
    var idx=S.fav.indexOf(code);
    if(idx>=0){ S.fav.splice(idx,1); toast('已取消收藏'); }
    else { S.fav.push(code); toast('已收藏，可在「我的」里查看'); }
    favSave(); paint(); return;
  }
});

/* ---- 语音简介（每门课程 / 选课页各自播报本页内容） ---- */
var SPEAKING=false;
function say(text){
  if(!window.speechSynthesis){ toast('当前浏览器不支持语音播报', true); return false; }
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=1.0; u.pitch=1.02;
  u.onend=function(){ SPEAKING=false; };
  speechSynthesis.speak(u);
  return true;
}
function doIntro(code){
  try{
    if(window.speechSynthesis && speechSynthesis.speaking){
      speechSynthesis.cancel(); SPEAKING=false; toast('已停止播报'); return;
    }
    var txt='';

      var list=S.courses||[];

      var parts=[];
      for(var k in byCat){ parts.push(k+byCat[k]+'个项目'); }
      txt='欢迎来到东平湖渔旅体验课堂的选课页。当前共开放 '+list.length+' 个项目，'+
          '分为'+parts.join('、')+'。每个项目都标明了时长、交付物、上课地点和价格，'+
          '点开任意一张卡片可以看详细介绍，也可以直接下单锁定名额。'+
          '下单只需选择日期与场次、填写联系人和人数，提交后会得到订单号和核销码，到场出示即可。'+
          '费用到店或开课前现场支付，本站不收取在线款项。';
    } else {
      var c=courseOf(code);
      if(!c){ toast('没有找到这个项目', true); return; }

      txt='这里是'+c.title+'。'+ (c.brief||'') +

          (c.deliverable? '完成后可以获得'+c.deliverable+'。':'') +

          (arr.length? '主要包含：'+arr.join('；')+'。':'') +

    }

/* ---- 背景音乐（默认关闭，仅由用户手动开启） ---- */
var BGM = { on:false, wasOn:false };
function bgmEl(){ return document.getElementById('bgm'); }
function bgmPaint(){
  var b=document.getElementById('musicBtn'); if(!b) return;
  b.textContent = BGM.on ? '🔊' : '🎵';
  b.title = BGM.on ? '关闭背景音乐' : '播放背景音乐';
  b.classList.toggle('on', BGM.on);
}
function bgmToggle(){
  var a=bgmEl(); if(!a) return;
  if(BGM.on){ a.pause(); BGM.on=false; bgmPaint(); toast('已关闭背景音乐'); return; }
  a.volume=0.4;
  var p=a.play();
  if(p&&p.catch) p.catch(function(){ toast('当前浏览器阻止了播放，请再点一次', true); });
  BGM.on=true; bgmPaint(); toast('背景音乐已开启');
}
(function initBgm(){
  var a=bgmEl(); if(!a) return;
  a.volume=0.4;
  a.addEventListener('playing', function(){ BGM.on=true; bgmPaint(); });
  a.addEventListener('pause', function(){ BGM.on=false; bgmPaint(); });
  document.addEventListener('visibilitychange', function(){
    var el=bgmEl(); if(!el) return;
    if(document.hidden){ if(!el.paused){ BGM.wasOn=true; el.pause(); } }
    else if(BGM.wasOn){ el.play().catch(function(){}); BGM.wasOn=false; }
  });
  bgmPaint();
})();

/* ---- 下单 ---- */
async function submitBooking(){
  if(S.busy) return;
  var b=S.booking, c=courseOf(b.code);
  if(!c || !b.date || !b.slot){ toast('请选择日期与场次', true); return; }
  var bad=false;
  if(!b.name.trim()){ var fn=document.getElementById('f-name'); if(fn) fn.classList.add('bad'); bad=true; }
  if(!/^1\d{10}$/.test(b.phone)){ var fp=document.getElementById('f-phone'); if(fp) fp.classList.add('bad'); bad=true; }
  if(bad){ toast('请检查联系人信息', true); return; }
  if(!S.session){
    S.afterLogin='book/'+b.code;
    toast('请先登录后再提交订单');
    setTimeout(function(){ go('login'); },700);
    return;
  }
  S.busy=true; paint();
  try{
    var seat = seatOf(c.code, b.date, b.slot);
    if(!seat) throw new Error('session_not_found');
    if(seat.booked + b.qty > seat.capacity) throw new Error('seat_not_enough');
    var total = c.price_cents * b.qty;
    var order = {
      id: Date.now(), order_no: newOrderNo(),
      owner: S.session.user.id,
      course_code: c.code, course_title: c.title, cat: c.cat,
      session_date: b.date, session_slot: b.slot, duration: c.duration,
      qty: b.qty, unit_price_cents: c.price_cents, total_cents: total,
      buyer_name: b.name.trim(), buyer_phone: b.phone,
      remark: (b.remark||'').trim() || null,
      status: 'pending', pay_method: 'onsite',
      checked_at: null, created_at: new Date().toISOString()
    };
    var all = ordersAll(); all.push(order); ordersSave(all);
    seat.booked += b.qty; saveSeats(localSeats());
    S.lastOrder = order;
    S.seatsByCourse[c.code] = null; delete S.seatsByCourse[c.code];
    S.orders = null; S.busy=false;
    toast('报名成功，名额已锁定');
    go('success');
  }catch(err){
    S.busy=false; paint(); toast(friendly(err), true);
  }
}

/* ---- 登录 ---- */
function setFldErr(id,show){ var f=document.getElementById(id); if(f) f.classList.toggle('bad', !!show); }
async function doLogin(){
  if(S.busy) return;
  var isReg = (S.loginMode||'login') === 'reg';
  var uEl=document.getElementById('i-user'), pEl=document.getElementById('i-pass');
  var user=(uEl&&uEl.value||'').trim(), pass=(pEl&&pEl.value||'');
  var bad=false;
  if(!/^[A-Za-z0-9]{4,20}$/.test(user)){ setFldErr('f-user',true); bad=true; } else setFldErr('f-user',false);
  if(pass.length<6){ setFldErr('f-pass',true); bad=true; } else setFldErr('f-pass',false);
  if(isReg){
    var nEl=document.getElementById('i-name'), phEl=document.getElementById('i-phone'), p2El=document.getElementById('i-pass2');
    var name=(nEl&&nEl.value||'').trim(), phone=(phEl&&phEl.value||'').replace(/\D/g,''), p2=(p2El&&p2El.value||'');
    if(!name){ setFldErr('f-name',true); bad=true; } else setFldErr('f-name',false);
    if(!/^1\d{10}$/.test(phone)){ setFldErr('f-phone',true); bad=true; } else setFldErr('f-phone',false);
    if(!p2 || p2!==pass){ setFldErr('f-pass2',true); bad=true; } else setFldErr('f-pass2',false);
    if(bad){ toast('请检查填写内容', true); return; }
    var list=usersAll();
    for(var i=0;i<list.length;i++){
      if(list[i].username===user){ setFldErr('f-user',true); toast('该账号已存在，请直接登录', true); return; }
    }
    S.busy=true; paint();
    var rec={ username:user, pass:hashPass(pass), name:name, phone:phone, createdAt:new Date().toISOString() };
    list.push(rec); usersSave(list);
    LS.set('dpl_session', user);
    S.login.user = user;
    S.booking.name=name; S.booking.phone=phone;
    S.busy=false; await refreshSession(); S.orders=null;
    toast('注册成功，已登录');
    var back=S.afterLogin; S.afterLogin=null;
    go(back || 'me');
    return;
  }
  if(bad){ toast('请检查账号与密码', true); return; }
  S.busy=true; paint();
  var list2=usersAll(), rec2=null;
  for(var j=0;j<list2.length;j++){ if(list2[j].username===user){ rec2=list2[j]; break; } }
  if(!rec2 || rec2.pass!==hashPass(pass)){ S.busy=false; paint(); toast('账号或密码不正确', true); return; }
  LS.set('dpl_session', user);
  S.login.user = user;
  S.booking.name=rec2.name; S.booking.phone=rec2.phone;
  S.busy=false; await refreshSession(); S.orders=null;
  toast('登录成功');
  var back2=S.afterLogin; S.afterLogin=null;
  go(back2 || 'me');
}
async function doLogout(){
  LS.del('dpl_session');
  S.session=null; S.orders=null;
  toast('已退出登录'); go('me');
}

/* ---- 取消 ---- */
async function doCancel(id){
  var o=(S.orders||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!o) return;
  if(!window.confirm('确认取消订单 '+o.order_no+' 吗？取消后名额立即释放，且不可恢复。')) return;
  S.busy=true;
  try{
    var all = ordersAll();
    for(var i=0;i<all.length;i++){
      if(String(all[i].id)===String(id)){
        if(all[i].owner !== (S.session&&S.session.user&&S.session.user.id)) throw new Error('not_owner');
        if(all[i].status!=='pending' && all[i].status!=='confirmed') throw new Error('not_cancelable');
        all[i].status='canceled'; all[i].updated_at=new Date().toISOString();
      }
    }
    ordersSave(all);
    var seat = seatOf(o.course_code, o.session_date, o.session_slot);
    if(seat){ seat.booked = Math.max(0, seat.booked - o.qty); saveSeats(localSeats()); }
    S.orders=null; S.seatsByCourse[o.course_code]=null; delete S.seatsByCourse[o.course_code];
    await loadOrders(true);
    S.busy=false; toast('订单已取消，名额已释放'); go('orders');
  }catch(err){ S.busy=false; paint(); toast(friendly(err), true); }
}

/* ---- 核销 ---- */
var STAFF_CODE = 'sangyuan2026';
async function doCheckin(){
  if(S.busy) return;
  var nel=document.getElementById('i-no'), sel=document.getElementById('i-staff');
  var no=(nel&&nel.value||'').trim().toUpperCase(), staff=(sel&&sel.value||'');
  if(!no){ setFldErr('f-no',true); return; }
  if(!staff){ setFldErr('f-staff',true); return; }
  setFldErr('f-no',false); setFldErr('f-staff',false);
  S.busy=true; paint();
  try{
    if(staff !== STAFF_CODE) throw new Error('invalid_staff_code');
    var all = ordersAll(), o = null;
    for(var i=0;i<all.length;i++){ if(all[i].order_no===no){ o=all[i]; break; } }
    if(!o) throw new Error('order_not_found');
    if(o.status==='canceled') throw new Error('order_canceled');
    var reused = (o.status==='used');
    if(!reused){ o.status='used'; o.checked_at=new Date().toISOString(); ordersSave(all); }
    S.busy=false; paint();
    var box=document.getElementById('ck-result');
    if(box){
      box.innerHTML='<div class="card" style="margin-top:14px;border-color:var(--moss)">'
        + '<h4>'+(reused?'⚠️ 该订单已核销过':'✅ 核销成功')+'</h4>'
        + '<dl class="kv"><dt>订单号</dt><dd>'+esc(o.order_no)+'</dd>'
        + '<dt>项目</dt><dd>'+esc(o.course_title)+'</dd>'
        + '<dt>数量</dt><dd>'+o.qty+'</dd>'
        + '<dt>场次</dt><dd>'+esc(o.session_date)+' '+esc(o.session_slot)+'</dd>'
        + '<dt>核销时间</dt><dd>'+esc(String(o.checked_at).slice(0,16).replace('T',' '))+'</dd>'
        + '</dl></div>';
    }
  }catch(err){
    S.busy=false; paint();
    var b3=document.getElementById('ck-result');
    if(b3) b3.innerHTML='<div class="card" style="margin-top:14px;border-color:var(--clay)"><h4>核销失败</h4><p>'+esc(friendly(err))+'</p></div>';
  }
}

/* ============ 启动 ============ */
async function boot(){
  var r=parseHash(), code=r.p;
  if(r.name==='course'||r.name==='book'){
    if(!S.booking.code || S.booking.code!==code){
      S.booking={ code:code, date:'', slot:'', qty:1, name:S.booking.name||'', phone:S.booking.phone||'', remark:'' };
    }
    if(S.route.name!==r.name) S.gal='';
  }
  S.route=r;
  paint();
  try{
    if(r.name==='home'||r.name==='courses'||r.name==='course'||r.name==='book'||r.name==='villages'||r.name==='routes'||r.name==='fav'||r.name==='me'){
      await loadCourses();
      await loadAllSeats();
    }
    if(r.name==='book' && !S.booking.date){
      var arr=S.seatsByCourse[code]||[];
      for(var i=0;i<arr.length;i++){
        if(Math.max(0,(arr[i].capacity||0)-(arr[i].booked||0))>0){ S.booking.date=arr[i].session_date; break; }
      }
    }
    if(r.name==='me'||r.name==='orders'||r.name==='order'||r.name==='checkin'||r.name==='success'){
      if(!S.session) await refreshSession();
      if(S.session && !S.orders) await loadOrders();
      if(r.name==='orders'){ S.orders=null; await loadOrders(); }
    }
  }catch(err){ toast(friendly(err), true); }
  paint();
}

/* 初始化：随机轮播顺序 + 收藏 */
(function initCar(){
  var idx=CARS.map(function(_,i){ return i; });
  for(var i=idx.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  S.carOrder=idx;
  S.car=0;
})();
S.fav = favLoad();

refreshSession().then(function(){ boot(); });

})();
</script>
